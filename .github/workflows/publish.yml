name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        default: latest
        required: true
        type: choice
        options:
          - latest
          - next
          - beta
          - alpha

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: pnpm prepublishOnly

      - name: Resolve npm dist-tag
        id: dist-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DIST_TAG: ${{ inputs.dist-tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_DIST_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$REF_NAME" == *-* ]]; then
            prerelease="${REF_NAME#*-}"
            channel="${prerelease%%[.-]*}"
            case "$channel" in
              alpha|beta|next) echo "tag=$channel" >> "$GITHUB_OUTPUT" ;;
              *) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with trusted publishing
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: >-
          pnpm publish --access public --tag "$NPM_DIST_TAG" --provenance
          --no-git-checks

name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      dist-tag:
        description: npm dist-tag to publish under
        default: latest
        required: true
        type: choice
        options:
          - latest
          - next
          - beta
          - alpha

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate package
        run: pnpm prepublishOnly

      - name: Resolve npm dist-tag
        id: dist-tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DIST_TAG: ${{ inputs.dist-tag }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=$INPUT_DIST_TAG" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_PRERELEASE" = "true" ]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish with trusted publishing
        env:
          NPM_DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: >-
          pnpm publish --access public --tag "$NPM_DIST_TAG" --provenance
          --no-git-checks
